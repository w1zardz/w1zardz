name: Update Age

on:
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC
  workflow_dispatch: # manual trigger
  push:
    branches: [main, master]

jobs:
  update-age:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update age in README
        run: |
          set -euo pipefail

          BIRTH_Y=2003
          BIRTH_M=6
          BIRTH_D=23

          # 10# prefix: "08"/"09" would otherwise be parsed as invalid octal
          TODAY_Y=$((10#$(date -u +%Y)))
          TODAY_M=$((10#$(date -u +%m)))
          TODAY_D=$((10#$(date -u +%d)))

          AGE=$((TODAY_Y - BIRTH_Y))
          if [ "$TODAY_M" -lt "$BIRTH_M" ] || { [ "$TODAY_M" -eq "$BIRTH_M" ] && [ "$TODAY_D" -lt "$BIRTH_D" ]; }; then
            AGE=$((AGE - 1))
          fi

          YOE=$((TODAY_Y - 2016))

          echo "age=$AGE years_of_experience=$YOE"

          # anchored to line start: an unanchored "age: " also matches
          # "first_langu[age: ]..." and clobbers it
          sed -i -E "s/^age: .*/age: $AGE/" README.md
          sed -i -E "s/^([[:space:]]*)years_of_experience: .*/\1years_of_experience: $YOE/" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update age to $(grep -m1 '^age: ' README.md | cut -d' ' -f2)"
            git push
          fi

      - name: Keepalive
        run: |
          # GitHub disables scheduled workflows after 60 days without repo
          # activity. The age bump only happens once a year, so push an empty
          # commit before that window closes.
          LAST=$(git log -1 --format=%ct)
          NOW=$(date -u +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "days since last commit: $DAYS"
          if [ "$DAYS" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (prevent scheduled workflow auto-disable)"
            git push
          fi
