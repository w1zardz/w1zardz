name: Profile

on:
  schedule:
    - cron: '17 3 * * *' # daily, off the hour to avoid GitHub's peak-minute queue
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/scripts/**'
      - '.github/workflows/profile.yml'

concurrency:
  group: profile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    name: Rebuild generated sections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for STATS_TOKEN
        id: gate
        run: |
          if [ -n "${{ secrets.STATS_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STATS_TOKEN is not set. Skipping regeneration — the" \
                 "default GITHUB_TOKEN cannot see private repositories and would" \
                 "silently replace the real totals with public-only ones." \
                 "Create a classic PAT with 'repo' + 'read:user' and add it as" \
                 "the STATS_TOKEN repository secret."
          fi

      - name: Rebuild README from live GitHub data
        if: steps.gate.outputs.ok == 'true'
        env:
          # Classic PAT, scopes: repo + read:user. Required — see the gate above.
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python .github/scripts/profile_stats.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "no change"
          else
            git add README.md
            git commit -m "chore(profile): refresh generated stats [skip ci]"
            git push
          fi

      - name: Keepalive
        run: |
          # GitHub disables scheduled workflows after 60 days without repo
          # activity. Push an empty commit before that window closes.
          LAST=$(git log -1 --format=%ct)
          DAYS=$(( ( $(date -u +%s) - LAST ) / 86400 ))
          echo "days since last commit: $DAYS"
          if [ "$DAYS" -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi
